config_version = 16

[bar.default]
center = []
end = [ "tray", "network", "bluetooth", "volume", "battery", "clock", "date", "session" ]
start = [ "control-center", "workspaces" ]
scale = 1.125
thickness = 42
widget_spacing = 12

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "local/kbd-backlight:tile"

[desktop_widgets]
enabled = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 618.0
    output = "eDP-1"
    placement_height = 800.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "local/kbd-backlight" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "path"
    location = "/home/thecreator/.config/noctalia-plugins"
    name = "local"

[shell.launcher]
categories = false
ignore_mouse = true
layout = "simple"
track_usage = false

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "hyprland", "kitty" ]

[wallpaper.default]
path = "/home/thecreator/Pictures/BG5.png"

[wallpaper.last]
path = "/home/thecreator/Pictures/BG5.png"

[wallpaper.monitors.eDP-1]
path = "/home/thecreator/Pictures/BG5.png"

[widget.battery]
display_mode = "graphic"
scale = 1.0

[widget.bluetooth]
scale = 1.4

[widget.control-center]
scale = 1.4

[widget.network]
scale = 1.4
show_label = false

[widget.session]
scale = 1.4

[widget.tray]
scale = 1.4

[widget.volume]
scale = 1.4
show_label = false

[widget.workspaces]
scale = 1.4
active_pill_size = 1.0
empty_color = "#00000000"
inactive_pill_size = 1.0
occupied_color = "#00000000"
style = "regular"
