# Universal copy/paste: Hyprland turns Cmd+C / Cmd+V into Ctrl+Insert / Shift+Insert
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# Font: JetBrains Mono, 12pt, heavier weights
font_family      family="JetBrains Mono" style="Bold"
bold_font        family="JetBrains Mono" style="ExtraBold"
italic_font      family="JetBrains Mono" style="Bold Italic"
bold_italic_font family="JetBrains Mono" style="ExtraBold Italic"
font_size 11.5
# macOS-style text rendering: thicker, higher-contrast strokes (kitty's macOS default)
text_composition_strategy 1.7 30

# Splits: Super+D side by side, Super+Shift+D stacked (new pane keeps the cwd)
enabled_layouts splits,stack
map super+d       launch --location=vsplit --cwd=current
map super+shift+d launch --location=hsplit --cwd=current

# Colors generated by Noctalia (theme.templates)
include themes/noctalia.conf
