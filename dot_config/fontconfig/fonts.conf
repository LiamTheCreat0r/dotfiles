<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- macOS-like text: Inter (closest free match to SF Pro) and JetBrains Mono,
     rendered with grayscale antialiasing and FreeType's autohinter in light
     mode (vertical-only snapping, glyph shapes kept), so that the stem
     darkening enabled via FREETYPE_PROPERTIES in hyprland.lua thickens thin
     strokes the way macOS does. Stem darkening fades out at HiDPI sizes, so
     Regular text is also bumped to Medium to get macOS's heavier look. -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting"   mode="assign"><bool>true</bool></edit>
    <edit name="autohint"  mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba"      mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
  </match>

  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Inter</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>JetBrains Mono</family></prefer>
  </alias>
  <!-- Web pages ask for the macOS / Windows UI fonts by name. binding="same"
       makes Chromium accept Inter for them instead of skipping to the next
       font in the CSS stack (often Noto Sans or Arial). -->
  <alias binding="same"><family>-apple-system</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>BlinkMacSystemFont</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Pro Display</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF UI Text</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Helvetica Neue</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Segoe UI</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>Segoe UI Variable</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="same"><family>SF Mono</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Menlo</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <alias binding="same"><family>Consolas</family><prefer><family>JetBrains Mono</family></prefer></alias>
  <!-- Thicker text: requests for Regular (or Book) get Medium. Runs after the
       aliases above, so it also catches sans-serif / monospace requests. -->
  <match target="pattern">
    <test name="family" qual="any"><string>Inter</string></test>
    <test name="weight" compare="more_eq"><const>book</const></test>
    <test name="weight" compare="less"><const>medium</const></test>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>JetBrains Mono</string></test>
    <test name="weight" compare="more_eq"><const>book</const></test>
    <test name="weight" compare="less"><const>medium</const></test>
    <edit name="weight" mode="assign" binding="strong"><const>medium</const></edit>
  </match>
</fontconfig>
